<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="color-scheme" content="dark">
    <title>AGRIVISION - Plant Detection System</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Decorative depth layer: soft blurred orbs behind the glass UI. Fixed,
         non-interactive, very low opacity - never affects readability or the
         camera. Purely CSS; no JS. -->
    <div class="bg-orbs" aria-hidden="true">
        <span class="orb orb--1"></span>
        <span class="orb orb--2"></span>
        <span class="orb orb--3"></span>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <!-- Drawn, not typed. A single leaf reads at 22px where a
                     two-leaf sprout collapses into a fork; the midrib strokes
                     itself in and the blade unfolds from the stem end, so the
                     mark grows rather than fades in. Same stroke language as
                     the two panel marks. -->
                <svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22"
                     aria-hidden="true" focusable="false">
                    <defs>
                        <linearGradient id="leafFill" x1="0" y1="1" x2="1" y2="0">
                            <stop offset="0" stop-color="#0f9c71"/>
                            <stop offset="1" stop-color="#6ee7b7"/>
                        </linearGradient>
                    </defs>
                    <path class="logo-blade" d="M4 20C4 11.2 10.2 4.6 20 4 20.6 13.8 13.6 20 4 20Z"
                          fill="url(#leafFill)"/>
                    <path class="logo-rib" d="M4.6 19.4C9 15 13.8 10.4 19.4 4.6"
                          fill="none" stroke="#0b3b2c" stroke-width="1.3"
                          stroke-linecap="round" opacity=".55"/>
                </svg>
                <span class="logo-word">AGRIVISION</span>
            </div>
            <div class="subtitle">AI VISION SYSTEM</div>
        </div>
        <div class="header-center">
            <div class="mode-badge" id="modeBadge">LIVE MODE</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Camera Panel -->
        <div class="main-panel">
            <div class="camera-wrapper">
                <video id="cameraFeed" class="camera-feed" playsinline autoplay></video>
                <canvas id="detectionCanvas" class="detection-canvas"></canvas>
                <!-- Instrument layer. Decorative and non-interactive: it sits
                     between the detection canvas and the popups and reacts to
                     state that is ALREADY in the DOM (which buttons are
                     enabled, whether the summary says detected) via :has(),
                     so no JS knows it exists and the pipeline is untouched.
                       corners  - draw in when the camera opens
                       scan     - sweeps only while detection is running
                       lock     - one pulse each time a plant is confirmed -->
                <div class="viewfinder" aria-hidden="true">
                    <span class="vf-corner vf-corner--tl"></span>
                    <span class="vf-corner vf-corner--tr"></span>
                    <span class="vf-corner vf-corner--bl"></span>
                    <span class="vf-corner vf-corner--br"></span>
                    <span class="vf-scan"></span>
                    <span class="vf-lock"></span>
                </div>

                <div class="camera-overlay" id="cameraOverlay">
                    <div class="overlay-message">
                        <div class="spinner"></div>
                        <p>Initializing Camera...</p>
                    </div>
                </div>

                <!-- Live feedback popup, shown over the video whenever the
                     detector reports ZERO valid plants in the current frame
                     (see UIManager.updateNoPlantPopup). Hidden by default. -->
                <div id="noPlantPopup" class="no-plant-popup" hidden role="alert">
                    <div class="no-plant-icon" aria-hidden="true">⚠️</div>
                    <div class="no-plant-title">NO PLANT DETECTED</div>
                    <div class="no-plant-message">Please show a plant to the camera.</div>
                </div>
            </div>

            <!-- Camera Controls -->
            <div class="camera-controls">
                <!-- ONE label per button, identical at every width. There is no
                     alternate/shortened mobile wording, and nothing here or in
                     style.css adds a second copy via ::before / ::after. On a
                     narrow phone the label is allowed to wrap onto two lines
                     rather than being swapped for a different string. -->
                <button id="startCameraBtn" class="btn btn-primary" aria-label="Start camera">
                    <span class="btn-icon" aria-hidden="true">▶</span>
                    <span class="btn-text">START CAMERA</span>
                </button>
                <button id="stopCameraBtn" class="btn btn-secondary" aria-label="Stop camera" disabled>
                    <span class="btn-icon" aria-hidden="true">⏹</span>
                    <span class="btn-text">STOP CAMERA</span>
                </button>
                <button id="startDetectionBtn" class="btn btn-success" aria-label="Start detection" disabled>
                    <span class="btn-icon" aria-hidden="true">⚡</span>
                    <span class="btn-text">START DETECTION</span>
                </button>
                <button id="stopDetectionBtn" class="btn btn-danger" aria-label="Stop detection" disabled>
                    <span class="btn-icon" aria-hidden="true">◼</span>
                    <span class="btn-text">STOP DETECTION</span>
                </button>
            </div>

        </div>

        <!-- Right Sidebar: the two sections the user actually acts on.
             Everything that used to live here - system status, per-detection
             internals, FPS/inference timings, engine name - was developer
             diagnostics and has been removed from the UI. The logic that
             produced it is untouched and still reachable from the console via
             the AGRIVISION.* diagnostics global. -->
        <div class="sidebar">
            <!-- 1. PLANT DETECTION - driven entirely by the COCO-SSD pipeline's
                 final, class-validated, de-duplicated, temporally confirmed
                 plant list. Nothing here is hard-coded or simulated. -->
            <div class="panel panel--detection">
                <div class="panel-header">
                    <h3 class="panel-title">
                        <svg class="panel-ico" viewBox="0 0 20 20" width="15" height="15"
                             aria-hidden="true" focusable="false">
                            <path d="M3.2 16.8c-1.6-5.2 1.6-11.2 8.4-12.9 1.9-.5 3.4-.6 4.8-.4.4 1.5.4 3.1 0 4.9-1.5 6.8-7.6 9.9-12.8 8.4Z"
                                  fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                            <path d="M4.6 16.1C7.7 12.4 11 9.6 15.2 7.7"
                                  fill="none" stroke="currentColor" stroke-width="1.2"
                                  stroke-linecap="round" opacity=".65"/>
                        </svg>PLANT DETECTION</h3>
                </div>
                <div class="detection-summary" id="detectionSummary" role="status" aria-live="polite">
                    <div class="summary-indicator offline">
                        <span class="indicator-dot"></span>
                        <span class="indicator-text">NO PLANT DETECTED</span>
                    </div>
                    <div class="summary-stat summary-stat--headline">
                        <span class="summary-label">Plants Detected</span>
                        <span class="summary-value" id="plantCountValue">0</span>
                    </div>
                    <div class="summary-stat">
                        <span class="summary-label">Confidence</span>
                        <span class="summary-value" id="confidenceValue">--</span>
                    </div>
                </div>
            </div>

            <!-- The CAMERA -> DETECTION -> HEALTH flow, made visible. Purely
                 decorative, so it is hidden from assistive tech. -->
            <div class="flow-arrow" aria-hidden="true">↓</div>

            <!-- 2. PLANT HEALTH - Model 2's verdict. Rendered by
                 UIManager.renderHealth(); it never invents a result. If the
                 trained classifier is not installed it says so, and if it is
                 installed but not confident it abstains. -->
            <div class="panel panel--health">
                <div class="panel-header">
                    <h3 class="panel-title">
                        <svg class="panel-ico" viewBox="0 0 20 20" width="15" height="15"
                             aria-hidden="true" focusable="false">
                            <path d="M7.4 15.9c-1.3-4.1 1.2-8.8 6.3-10.1 1.4-.4 2.6-.5 3.6-.3.3 1.1.3 2.4 0 3.7-1.2 5.3-5.8 7.7-9.9 6.7Z"
                                  fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                            <path d="M1.6 12.3h2.1l1.2-2.7 1.7 4.6.9-1.9"
                                  fill="none" stroke="currentColor" stroke-width="1.4"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>PLANT HEALTH</h3>
                </div>
                <svg class="leaf-watermark" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
                    <path d="M14 106C2 72 20 26 66 12c13-4 24-5 34-3 3 10 2 22-2 35-14 46-58 70-84 62Z"
                          fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
                    <path d="M18 102C40 74 64 52 96 38" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M45 93c1-14 5-27 11-37M67 79c-3-12-1-25 3-35"
                          fill="none" stroke="currentColor" stroke-width="1.6" opacity=".75"/>
                </svg>
                <div class="health-body" id="plantHealth" role="status" aria-live="polite">
                    <div class="health-note">Waiting for plant detection…</div>
                </div>
            </div>
        </div>
    </main>

    <!-- TensorFlow.js + COCO-SSD (fallback) and tfjs-tflite (custom plant detector).
         Versions are pinned deliberately, not just for reproducibility:
         @tensorflow/tfjs-tflite never left alpha (last published 0.0.1-alpha.10 in
         2023) and declares an exact peer dependency on tfjs-core@4.9.0, while
         coco-ssd@2.2.3 requires tfjs-core^4.10.0 - loading unpinned "latest" tags
         mixed a 2023 alpha WASM plugin against a tfjs-core two years newer than what
         it was built against, which is a known source of silent load failures/hangs
         in tfjs-tflite. 4.10.0 is the closest core version that satisfies coco-ssd's
         declared range while staying one minor version from what tfjs-tflite tested. -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js"></script>

    <!-- UI PROBE STUBS. Replace ONLY the two model libraries. Real tfjs is kept
         (cropToTensor genuinely uses it) and /script.js is loaded unmodified, so
         the detection pipeline, the tracker and every UI code path under test
         are the production ones. -->
    <script>
    (function () {
      // Each scenario is a list of RAW boxes as COCO-SSD would emit them,
      // including the non-plant classes the pipeline is supposed to reject.
      window.__scenarios = {
        empty:        [],
        personOnly:   [{ class: 'person', score: 0.95, bbox: [40, 30, 150, 380] }],
        objectsOnly:  [{ class: 'person', score: 0.93, bbox: [20, 20, 120, 300] },
                       { class: 'chair',  score: 0.71, bbox: [330, 180, 140, 190] },
                       { class: 'laptop', score: 0.64, bbox: [180, 300, 120, 90] }],
        onePlant:     [{ class: 'potted plant', score: 0.92, bbox: [200, 110, 170, 230] }],
        personPlant:  [{ class: 'person',       score: 0.96, bbox: [20, 20, 130, 380] },
                       { class: 'potted plant', score: 0.89, bbox: [220, 120, 160, 220] }],
        twoPlants:    [{ class: 'potted plant', score: 0.91, bbox: [60, 110, 150, 210] },
                       { class: 'potted plant', score: 0.87, bbox: [330, 130, 150, 210] }],
        threePlants:  [{ class: 'potted plant', score: 0.93, bbox: [30, 110, 130, 200] },
                       { class: 'potted plant', score: 0.88, bbox: [230, 120, 130, 200] },
                       { class: 'potted plant', score: 0.85, bbox: [430, 115, 130, 200] }],
        plantAndVase: [{ class: 'potted plant', score: 0.90, bbox: [200, 110, 170, 230] },
                       { class: 'vase',         score: 0.66, bbox: [235, 250, 100, 95] }]
      };
      window.__scenario = 'empty';
      window.__detects = 0;

      window.cocoSsd = {
        load: async () => ({
          detect: async () => {
            window.__detects++;
            const boxes = window.__scenarios[window.__scenario] || [];
            // deep copy - the pipeline is free to mutate what it is handed
            return boxes.map(b => ({ class: b.class, score: b.score, bbox: b.bbox.slice() }));
          }
        })
      };

      // Model 2: probabilities over the 4 classes in _probe/model/class_names.json
      // (Tomato healthy / Tomato Early blight / Potato healthy / Potato Late blight).
      // __health picks which verdict the classifier "returns".
      window.__healthProbs = {
        healthy:   [0.94, 0.03, 0.02, 0.01],
        unhealthy: [0.06, 0.87, 0.04, 0.03],
        uncertain: [0.30, 0.28, 0.22, 0.20]
      };
      window.__health = 'healthy';
      window.__model2Calls = 0;

      window.tflite = {
        setWasmPath() {},
        loadTFLiteModel: async () => ({
          predict: () => {
            window.__model2Calls++;
            return window.tf.tensor2d([window.__healthProbs[window.__health]]);
          }
        })
      };
    })();
    </script>

    <!-- Application Script -->
    <script src="/script.js"></script>
</body>
</html>
